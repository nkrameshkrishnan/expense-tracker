# AWS SAM template for Ledger's server-mediated backend.
#
# Networking is self-contained: the VPC/subnets/DB subnet group below are
# created fresh by this template rather than depending on an existing
# account VPC, so `sam deploy` works standalone. This is deliberately
# minimal — no NAT gateway, no internet gateway, no route beyond local —
# because the RDS Data API doesn't need it: DataFunction/PostConfirmation-
# Function call the public `rds-data.amazonaws.com` endpoint directly (they
# are NOT in this VPC at all), and that AWS-managed service is what actually
# reaches into the cluster's subnets on the backend's behalf. The only thing
# that genuinely can't be filled in here is the Google OAuth client
# id/secret for the Cognito identity provider (reuse the existing Google
# Cloud OAuth app this project already has for Google Sign-In, or create a
# new one scoped to this API) — those are real secrets, supplied at deploy
# time below, never committed.
#
# Deploy with: sam build && sam deploy --guided

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ledger — server-mediated multi-tenant backend (Approach A)

Parameters:
  Stage:
    Type: String
    Default: dev
  GoogleClientId:
    Type: String
    NoEcho: true
  GoogleClientSecret:
    Type: String
    NoEcho: true
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin for CORS (e.g. https://nkrameshkrishnan.github.io) — tighten from * before going live.
  FrontendUrl:
    Type: String
    Description: >-
      Exact frontend URL for Cognito's OAuth redirect (e.g.
      https://nkrameshkrishnan.github.io/Expense_tracker_New/frontend/).
      Unlike AllowedOrigin, Cognito's CallbackURLs/LogoutURLs reject "*"
      outright — this must be a real, reachable URL, required (no default).
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  StripePriceIdPro:
    Type: String
  StripePriceIdFamily:
    Type: String
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20241022-v2:0
    Description: >-
      Bedrock model id for AI transaction extraction (extract.js). Model
      availability varies by region and requires enabling model access in
      the AWS account first - verify both before deploying to a new
      region (see this feature's spec, Open Questions #1-2).
  SesFromAddress:
    Type: String
    Description: Verified SES sender address for billing notification emails.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
        DB_SECRET_ARN: !Ref DbSecret
        DB_NAME: ledger
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_PRICE_ID_PRO: !Ref StripePriceIdPro
        STRIPE_PRICE_ID_FAMILY: !Ref StripePriceIdFamily
        SES_FROM_ADDRESS: !Ref SesFromAddress

Resources:
  # --------------------------------------------------------------- Compute
  AiUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterOneDay
            Status: Enabled
            ExpirationInDays: 1

  AiUploadsMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Properties:
      Role: !GetAtt AiUploadsMalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref AiUploadsBucket
      Actions:
        Tagging:
          Status: ENABLED

  AiUploadsMalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AiUploadsMalwareScanAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !GetAtt AiUploadsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:PutObjectVersionTagging
                Resource:
                  - !Sub ${AiUploadsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub ${AiUploadsBucket.Arn}/malware-protection-resource-validation-object
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com

  DataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          AI_UPLOADS_BUCKET: !Ref AiUploadsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt DbCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObjectTagging
              Resource: !Sub ${AiUploadsBucket.Arn}/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /data
            Method: GET
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /data
            Method: POST
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /data
            Method: OPTIONS

  AiImportGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ledger-${Stage}-ai-import-guardrail
      Description: Content safety and prompt-attack defense for the AI transaction import feature - see docs/superpowers/specs/2026-08-23-ai-import-security-hardening-design.md, Section A.
      BlockedInputMessaging: "This file could not be processed."
      BlockedOutputsMessaging: "This file could not be processed."
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: SEXUAL
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: VIOLENCE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: PROMPT_ATTACK
            InputStrength: MEDIUM
            OutputStrength: NONE # PROMPT_ATTACK only applies to input
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: ANONYMIZE
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: ANONYMIZE

  AiImportGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt AiImportGuardrail.GuardrailId
      Description: v1 - initial content filters + prompt-attack detection

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: extract.handler
      Timeout: 25 # under API Gateway's hard 29s integration ceiling - see this feature's spec, Architecture §2
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_GUARDRAIL_ID: !GetAtt AiImportGuardrail.GuardrailId
          BEDROCK_GUARDRAIL_VERSION: !GetAtt AiImportGuardrailVersion.Version
          AI_UPLOADS_BUCKET: !Ref AiUploadsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt DbCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              # Covers both invocation paths a Claude model on Bedrock may
              # need: the bare foundation-model id (BedrockModelId's
              # default), and - for models that only work via a
              # cross-region inference profile - the profile ARN plus the
              # regional foundation-model ARNs it routes to. Profile ids
              # are AWS-managed, not account-owned, hence the wildcard
              # scoped to this account/region rather than a single
              # resource id.
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt AiImportGuardrail.GuardrailArn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectTagging
                - s3:DeleteObject
              Resource: !Sub ${AiUploadsBucket.Arn}/*
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /extract
            Method: POST
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /extract
            Method: OPTIONS

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: postConfirmation.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt DbCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
            - Effect: Allow
              Action: cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: stripeWebhook.handler
      Environment:
        Variables:
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt DbCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /webhooks/stripe
            Method: POST

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # API Gateway account-level throttling (token bucket, shared across every
      # request to every route on this stage — not per-IP or per-tenant on
      # its own). This is the free, no-extra-AWS-spend first line of defense
      # against a runaway client or credential-stuffing traffic driving up
      # the Lambda/Aurora bill, sized generously enough that one household's
      # refresh() (up to ~10 sequential GETs) never gets anywhere close to
      # it. Revisit upward as real concurrent usage grows. True per-IP
      # limiting now lives one layer down, in WebAcl's rate-based rule below
      # (blocks a single abusive IP before it can consume this shared
      # budget) and in RateLimitTable/rateLimit.js inside DataFunction
      # itself (catches invalid-token brute-forcing too, which never reaches
      # a route handler for the WAF rule to score against).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        # x-active-tenant is allowed: auth.js validates it against real
        # tenant_users membership before trusting it, unlike the removed
        # x-tenant-id header. Mirror any change here in handler.js's
        # CORS_HEADERS.
        AllowHeaders: [authorization, content-type, x-active-tenant]
        AllowMethods: [GET, POST, OPTIONS]

  # True per-IP throttling — DefaultRouteSettings above is one shared budget
  # for the whole API, so a single abusive IP can otherwise consume it and
  # starve every real user. Scope must be REGIONAL: CLOUDFRONT scope only
  # applies to CloudFront distributions, not a regional API Gateway HTTP
  # API. Deliberately just the rate-based rule, not AWS Managed Rule Groups
  # (AWSManagedRulesCommonRuleSet etc.) — those add real per-rule-group and
  # per-request cost for signature-based protection (SQLi, XSS payloads)
  # this app doesn't specifically need yet, since every query already goes
  # through parameterized RDS Data API calls. Add them later if that
  # changes.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ledger-${Stage}-api
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ledger-${Stage}-api
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              # Requests per 5-minute rolling window, per source IP - well
              # above what one household's normal usage could ever hit, but
              # low enough that a single IP can't quietly eat the whole
              # DefaultRouteSettings budget above (10 req/s = 3000/5min
              # shared across every client on the API).
              Limit: 500
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ledger-${Stage}-rate-limit

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/apis/${HttpApi}/stages/${Stage}
      WebACLArn: !GetAtt WebAcl.Arn

  # Backs rateLimit.js's per-source-IP check inside DataFunction itself -
  # the complement to WebAcl above, which only sees traffic that reaches API
  # Gateway with a route match. This also catches repeated invalid-token
  # attempts (a token verification failure never reaches a route handler,
  # but rateLimit.js runs before requireUser()). PAY_PER_REQUEST: no fixed
  # monthly cost, and item volume here is tiny (one row per IP per 60s
  # window, self-deleting via TTL).
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ledger-${Stage}-rate-limit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ------------------------------------------------------------------ Auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ledger-${Stage}
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
      # AUDIT, not ENFORCED: logs compromised-credential/risk detections to
      # CloudWatch (visible under the User Pool's "Advanced security" tab)
      # without blocking or challenging a real sign-in on a false positive,
      # which would have no support flow to recover from today. Move to
      # ENFORCED once there's been a chance to see what AUDIT actually flags
      # for real traffic. NOTE: enabling this moves the User Pool onto
      # Cognito's Essentials/Plus feature plan rather than Lite - check
      # current Cognito pricing for that tier before this goes to a real
      # account with real MAUs, since it changes the pricing basis for the
      # whole pool, not just an added per-feature line item.
      UserPoolAddOns:
        AdvancedSecurityMode: AUDIT
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      SupportedIdentityProviders: [Google]
      # Implicit, not authorization-code: frontend/assets/app.js's
      # cognitoAuthorizeUrl() requests response_type=token, a deliberate
      # earlier design choice so the zero-build frontend needs no
      # token-exchange endpoint (the code flow's /oauth2/token call requires
      # a backend to hold it). Declaring [code] here while the frontend asks
      # for a token makes Cognito reject every sign-in. If this ever moves
      # to [code], app.js must change in the same commit.
      AllowedOAuthFlows: [implicit]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      GenerateSecret: false
      CallbackURLs:
        - !Ref FrontendUrl
      LogoutURLs:
        - !Ref FrontendUrl

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ledger-${Stage}-${AWS::AccountId}

  # --------------------------------------------------------------- Networking
  # Minimal, self-contained, no egress at all — nothing in these subnets ever
  # needs to reach the internet (see the file-level comment at the top for
  # why: DataFunction talks to the public rds-data.amazonaws.com endpoint,
  # never to the cluster directly). No NAT gateway, no internet gateway,
  # both of which would be pure ongoing cost for zero benefit here.
  LedgerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ledger-${Stage}

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LedgerVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ledger-${Stage}-db-a

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LedgerVpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ledger-${Stage}-db-b

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Aurora subnets for ledger-${Stage}
      SubnetIds:
        - !Ref DbSubnetA
        - !Ref DbSubnetB

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Ledger ${Stage} Aurora cluster — no inbound rules needed, Data API doesn't connect over the VPC network path"
      VpcId: !Ref LedgerVpc
      SecurityGroupEgress:
        # Deny-all egress (the implicit default allow-all removed) — nothing
        # in this security group ever needs to reach out; the Lambdas that talk
        # to the Data API live entirely outside this VPC.
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32

  # -------------------------------------------------------------- Database
  # Aurora Serverless v2 at floor capacity (0.5 ACU) — near-zero idle cost,
  # matches the pre-validation stage this scaffold targets. EnableHttpEndpoint
  # turns on the Data API so DataFunction/PostConfirmationFunction never need
  # VPC networking of their own.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ledger-${Stage}-db-credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "ledger_admin"}'
        GenerateStringKey: password
        ExcludeCharacters: '"@/\'
        PasswordLength: 32

  DbCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineMode: provisioned
      # No EngineVersion pin: AWS deprecates specific Aurora PostgreSQL minor
      # versions for new-cluster creation over time (15.4 was pinned here
      # before and later became one of them). Omitting it lets RDS pick
      # whatever minor version is currently the default for aurora-postgresql
      # at stack-creation time, so this never goes stale on its own.
      DatabaseName: ledger
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}::username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}::password}}"
      EnableHttpEndpoint: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref DbCluster
      DBSubnetGroupName: !Ref DbSubnetGroup

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolDomain:
    Value: !Sub "https://ledger-${Stage}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
