<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found &mdash; Ledger</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314151a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23b24a33' text-anchor='middle'%3E%E2%80%96%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #14151a;
        --ink-3: #585b66;
        --paper: #f6f7f9;
        --rule: #e7e8ed;
        --amber: #b24a33;
        --mono: "Inter", ui-monospace, SFMono-Regular, Menlo, monospace;
        --disp: "Sora", system-ui, -apple-system, Segoe UI, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--disp);
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .mark {
        font-family: Georgia, serif;
        font-size: 40px;
        color: var(--amber);
        margin-bottom: 8px;
      }
      .code {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        text-transform: uppercase;
      }
      h1 {
        font-size: 22px;
        margin: 14px 0 10px;
      }
      p {
        color: var(--ink-3);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a.home {
        display: inline-block;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--rule);
        border-bottom: 2px solid var(--amber);
        padding: 10px 18px;
      }
      a.home:hover {
        border-color: var(--amber);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">&#8214;</div>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>
        That entry isn&rsquo;t in the ledger. The page you&rsquo;re looking for
        doesn&rsquo;t exist or has moved.
      </p>
      <a class="home" href="./">Back to Ledger</a>
    </div>
  </body>
</html>
