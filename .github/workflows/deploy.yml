name: Deploy to GitHub Pages

# Injects the Apps Script endpoint from repository secrets into assets/config.js
# at build time, then publishes.
#
# READ THIS: the generated config.js is downloaded by every visitor. GitHub Secrets
# keep values out of your *repository*; they cannot keep them out of a *static page*.
# If the sheet holds anything you would not hand to a stranger, leave the secrets
# unset and enter the endpoint at runtime under Data → Google Sheet instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages, upload-pages-artifact and deploy-pages haven't released
    # Node 24 versions yet (issues open as of Aug 2026). This opts in explicitly
    # and silences the deprecation warnings until they do.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Inject configuration from secrets
        env:
          SHEETS_ENDPOINT: ${{ secrets.SHEETS_ENDPOINT }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          if [ -z "$SHEETS_ENDPOINT" ]; then
            echo "::warning::SHEETS_ENDPOINT is not set. The site will ship without an endpoint and users must enter it under Data → Google Sheet."
          else
            case "$SHEETS_ENDPOINT" in
              https://script.google.com/macros/s/*/exec) : ;;
              *) echo "::error::SHEETS_ENDPOINT must be an Apps Script web app URL ending in /exec."; exit 1 ;;
            esac
            echo "::warning::Endpoint baked into assets/config.js — it is publicly readable on the deployed site."
          fi

          # Generated with node (always present on ubuntu-latest) so JSON.stringify
          # handles escaping — a quote or backslash in a secret cannot break the module.
          node -e '
            const fs = require("fs");
            const q = v => JSON.stringify(v ?? "");
            const stamp = process.env.GITHUB_SHA.slice(0,7) + " " + new Date().toISOString().slice(0,16) + "Z";
            fs.writeFileSync("assets/config.js",
              "/* Generated by GitHub Actions. Do not edit; overwritten on deploy. */\n" +
              "export const SHEETS_ENDPOINT = " + q(process.env.SHEETS_ENDPOINT) + ";\n" +
              "export const SHEETS_TOKEN = " + q(process.env.SHEETS_TOKEN) + ";\n" +
              "export const BUILD_STAMP = " + q(stamp) + ";\n");
          '

          # Validate as a real ES module. `node --check` on a .js file parses it as
          # CommonJS and will happily accept broken `export` syntax, so copy to .mjs.
          cp assets/config.js /tmp/config.mjs && node --check /tmp/config.mjs
          echo "--- generated (endpoint id masked) ---"
          sed -E 's#(macros/s/)[^/]+#\1***#' assets/config.js

      - name: Sanity-check the bundle
        run: |
          for f in index.html assets/app.js assets/store.js assets/xlsxio.js assets/charts.js assets/config.js; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          node --check assets/app.js
          node --check assets/store.js
          node --check assets/xlsxio.js
          node --check assets/charts.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4