name: Deploy to GitHub Pages

# Injects the Supabase URL/anon key and Google client ID from repository secrets
# into assets/config.js at build time, then publishes.
#
# READ THIS: the generated config.js is downloaded by every visitor. GitHub Secrets
# keep values out of your *repository*; they cannot keep them out of a *static page*.
# If your Supabase project holds anything you would not hand to a stranger, leave the
# secrets unset and enter the URL/key at runtime under Data → Supabase instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages, upload-pages-artifact and deploy-pages haven't released
    # Node 24 versions yet (issues open as of Aug 2026). This opts in explicitly
    # and silences the deprecation warnings until they do.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Inject configuration from secrets
        env:
          # Stored as a Secret rather than a Variable so GitHub masks it as ***
          # in workflow logs. Technically this ID is not sensitive on its own —
          # Google's OAuth origin restriction is the real protection, and the
          # browser sends this value in plaintext on every sign-in anyway — but
          # using a Secret here costs nothing and keeps it out of the log output.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # Public by design (see assets/config.js) - access is enforced by RLS,
          # not by keeping this out of the bundle. Stored as a Secret anyway so
          # it isn't echoed in workflow logs.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is not set. Google sign-in will not work until it is added as a repo Secret."
          elif [[ "$GOOGLE_CLIENT_ID" != *".apps.googleusercontent.com" ]]; then
            echo "::error::GOOGLE_CLIENT_ID must end in .apps.googleusercontent.com — got a value that doesn't look like a real client ID."
            exit 1
          else
            echo "GOOGLE_CLIENT_ID is set and looks valid (value masked)."
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY not set. The site will ship without a backend and users must enter them under Data → Supabase."
          else
            echo "::warning::Supabase URL and anon key baked into assets/config.js — publicly readable on the deployed site (expected; access is enforced by RLS)."
          fi

          # Generated with node (always present on ubuntu-latest) so JSON.stringify
          # handles escaping — a quote or backslash in a secret cannot break the module.
          node -e '
            const fs = require("fs");
            const q = v => JSON.stringify(v ?? "");
            const stamp = process.env.GITHUB_SHA.slice(0,7) + " " + new Date().toISOString().slice(0,16) + "Z";
            fs.writeFileSync("assets/config.js",
              "/* Generated by GitHub Actions. Do not edit; overwritten on deploy. */\n" +
              "export const GOOGLE_CLIENT_ID = " + q(process.env.GOOGLE_CLIENT_ID) + ";\n" +
              "export const SUPABASE_URL = " + q(process.env.SUPABASE_URL) + ";\n" +
              "export const SUPABASE_ANON_KEY = " + q(process.env.SUPABASE_ANON_KEY) + ";\n" +
              "export const BUILD_STAMP = " + q(stamp) + ";\n");
          '

          # Validate as a real ES module. `node --check` on a .js file parses it as
          # CommonJS and will happily accept broken `export` syntax, so copy to .mjs.
          cp assets/config.js /tmp/config.mjs && node --check /tmp/config.mjs
          # Nothing here needs masking - SUPABASE_URL/SUPABASE_ANON_KEY and
          # GOOGLE_CLIENT_ID are all public by design (see assets/config.js).
          echo "--- generated ---"
          cat assets/config.js

      - name: Sanity-check the bundle
        run: |
          for f in index.html assets/app.js assets/store.js assets/xlsxio.js assets/charts.js assets/config.js; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          node --check assets/app.js
          node --check assets/store.js
          node --check assets/xlsxio.js
          node --check assets/charts.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
