name: Fetch daily gold and silver price

# Also fetches silver (see the silver step below), stored as a second row per
# day in the same table (primary key is (date, metal)).
#
# Fetches the spot gold price (CAD, per troy ounce) from goldprice.dev, converts
# to price-per-gram, and upserts today's row into gold_price_history via the
# Supabase REST API using the project's secret key (Project Settings -> API
# Keys -> Secret keys in Supabase's current API key system; the replacement
# for the older service_role key, and bypasses RLS the same way - this table
# has no insert/update policy for anon/authenticated, see supabase/schema.sql).
# The stored price is always the 24K (pure gold) spot price. Purity is NOT
# applied here: each holding carries its own purity_karat and the app values
# it at price x karat/24 (22K = 22/24, 18K = 18/24, ...). Keep it that way so
# one price row serves every lot.
# No Supabase Edge Function is involved; this workflow is the entire pipeline.

on:
  schedule:
    - cron: "0 13 * * *" # ~9am Eastern (UTC-4/5) daily
  workflow_dispatch:

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch spot price and upsert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_SECRET_KEY not set as repo secrets. Skipping fetch."
            exit 1
          fi

          RESPONSE=$(curl -sf "https://api.goldprice.dev/v1/prices?symbol=XAU-CAD-SPOT")
          PRICE_PER_OUNCE=$(echo "$RESPONSE" | node -e '
            let data = "";
            process.stdin.on("data", d => data += d);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              const price = Number(parsed.symbols[0].price);
              if (!isFinite(price) || price <= 0) { throw new Error("bad price: " + parsed.symbols[0].price); }
              console.log(price);
            });
          ')

          # 1 troy ounce = 31.1034768 grams.
          PRICE_PER_GRAM=$(node -e "console.log(($PRICE_PER_OUNCE / 31.1034768).toFixed(2))")
          TODAY=$(date -u +%F)

          echo "Gold price: \$$PRICE_PER_OUNCE/oz -> \$$PRICE_PER_GRAM/g on $TODAY"

          curl -sf -X POST "$SUPABASE_URL/rest/v1/gold_price_history?on_conflict=date,metal" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"date\": \"$TODAY\", \"metal\": \"Gold\", \"price_per_gram_cad\": $PRICE_PER_GRAM}"

          echo "Gold upserted successfully."

          # ---- Silver ------------------------------------------------------
          # goldprice.dev's free tier is gold-only (XAG-CAD-SPOT is plan-gated),
          # so silver comes from gold-api.com, which quotes USD per troy ounce
          # and needs no key. To get CAD without another feed, reuse gold: the
          # USD->CAD rate is (gold in CAD) / (gold in USD) from the two quotes
          # above/below taken moments apart. The stored price is pure (.999+)
          # silver per gram; lot purity (925 sterling, ...) is applied in the app.
          GOLD_USD=$(curl -sf "https://api.gold-api.com/price/XAU" | node -e '
            let d = ""; process.stdin.on("data", c => d += c);
            process.stdin.on("end", () => {
              const p = Number(JSON.parse(d).price);
              if (!isFinite(p) || p <= 0) throw new Error("bad XAU USD price");
              console.log(p);
            });')
          SILVER_USD=$(curl -sf "https://api.gold-api.com/price/XAG" | node -e '
            let d = ""; process.stdin.on("data", c => d += c);
            process.stdin.on("end", () => {
              const p = Number(JSON.parse(d).price);
              if (!isFinite(p) || p <= 0) throw new Error("bad XAG USD price");
              console.log(p);
            });')
          SILVER_PER_GRAM=$(node -e "
            const usdToCad = $PRICE_PER_OUNCE / $GOLD_USD;
            if (!(usdToCad > 1 && usdToCad < 2)) throw new Error('implausible USD->CAD ' + usdToCad);
            console.log(($SILVER_USD * usdToCad / 31.1034768).toFixed(2));
          ")
          echo "Silver price: \$$SILVER_USD USD/oz -> \$$SILVER_PER_GRAM CAD/g on $TODAY"

          curl -sf -X POST "$SUPABASE_URL/rest/v1/gold_price_history?on_conflict=date,metal" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"date\": \"$TODAY\", \"metal\": \"Silver\", \"price_per_gram_cad\": $SILVER_PER_GRAM}"

          echo "Silver upserted successfully."
