name: Fetch daily exchange rates

# Fetches CAD-per-unit rates for INR and AED from the CBSA's public exchange
# rate feed (official Canadian government data, sourced from either CBSA or
# the Bank of Canada, no API key required) and upserts today's rows into
# exchange_rates via the Supabase REST API using the project's secret key
# (Project Settings -> API Keys -> Secret keys), which bypasses RLS the same
# way fetch-gold-price.yml already does for gold_price_history - that table
# has no insert/update policy for anon/authenticated, see supabase/schema.sql.
# No Supabase Edge Function is involved; this workflow is the entire pipeline.
#
# The feed's "Rate" field is already "1 unit of FromCurrency = Rate CAD" -
# i.e. exactly assets/constants.js's fx_rate, the multiplier that turns a
# native amount into its CAD equivalent. No inversion needed (unlike the
# open.er-api.com source this replaced, which gave units-of-X-per-CAD).

on:
  schedule:
    - cron: "15 13 * * *" # ~9:15am Eastern (UTC-4/5) daily, after the gold-price job
  workflow_dispatch:

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CBSA/BoC cross-rates and upsert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_SECRET_KEY not set as repo secrets. Skipping fetch."
            exit 1
          fi

          RESPONSE=$(curl -sf "https://bcd-api-dca-ipa.cbsa-asfc.cloud-nuage.canada.ca/exchange-rate-lambda/exchange-rates")

          for CUR in INR AED; do
            LINE=$(echo "$RESPONSE" | node -e '
              let data = "";
              process.stdin.on("data", d => data += d);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(data);
                const rows = parsed.ForeignExchangeRates || [];
                const hit = rows.find(
                  (r) => r.FromCurrency?.Value === "'"$CUR"'" && r.ToCurrency?.Value === "CAD",
                );
                if (!hit) { throw new Error("no CAD rate found for '"$CUR"' in feed"); }
                const rate = Number(hit.Rate);
                if (!isFinite(rate) || rate <= 0) { throw new Error("bad rate for '"$CUR"': " + hit.Rate); }
                // Effective date is the feed'"'"'s own dated record, not just
                // "today" per the runner'"'"'s clock - keeps the stored date
                // correct even if this job runs slightly early/late UTC.
                const date = (hit.ExchangeRateEffectiveTimestamp || "").slice(0, 10);
                if (!date) { throw new Error("no effective date for '"$CUR"'"); }
                console.log(date + " " + rate.toFixed(8));
              });
            ')

            DATE=$(echo "$LINE" | cut -d" " -f1)
            RATE_TO_CAD=$(echo "$LINE" | cut -d" " -f2)

            echo "$CUR: $RATE_TO_CAD CAD per unit on $DATE"

            curl -sf -X POST "$SUPABASE_URL/rest/v1/exchange_rates" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "{\"date\": \"$DATE\", \"currency\": \"$CUR\", \"rate_to_cad\": $RATE_TO_CAD}"
          done

          echo "Upserted successfully."
